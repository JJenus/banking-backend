spring:
  application:
    name: banking-backend

  # ── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_db}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:changeme}
    hikari:
      pool-name: BankingPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: banking

  # ── Flyway migrations ─────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: banking
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Redis — idempotency keys and caching ─────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ── Mail — points at self-hosted Postal SMTP ──────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@banking.local}

  # ── Security — Keycloak as OAuth2 resource server ────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak OIDC discovery endpoint for your realm
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}

  # ── Spring Modulith — events persistence (outbox pattern) ────────────────
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

  # ── Caching ───────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 86400000   # 24 hours default TTL

  # ── Thymeleaf — email templates ───────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:true}

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never     # Never leak exception messages in production
    include-stacktrace: never
  servlet:
    context-path: /api

# ── Actuator — Prometheus scrape endpoint ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}/protocol/openid-connect/auth
  show-actuator: false

# ── Application-specific properties ──────────────────────────────────────
banking:
  keycloak:
    realm: ${KEYCLOAK_REALM:banking}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:banking-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}

  idempotency:
    ttl-hours: 24               # How long idempotency keys are cached in Redis

  # ── Fee policy ────────────────────────────────────────────────────────────
  # Controls the FeePolicy bean wired into TransferApplicationService.
  # Change type and restart — no code change required.
  #
  # Options:
  #   NONE              — no fee (default; use in development/staging)
  #   NIGERIAN_INTERBANK — 0.1%, min NGN 10, max NGN 2,000
  #   PERCENTAGE        — custom rate with min/max caps (requires rate, min-amount, max-amount, fee-currency)
  #   FLAT              — fixed fee per transfer (requires flat-amount, fee-currency)
  fees:
    type: ${FEE_POLICY_TYPE:NONE}
    # Uncomment and set for PERCENTAGE policy:
    # rate: 0.001
    # min-amount: 10.00
    # max-amount: 2000.00
    # fee-currency: NGN
    # Uncomment and set for FLAT policy:
    # flat-amount: 50.00
    # fee-currency: NGN

  notifications:
    from-name: ${NOTIFICATION_FROM_NAME:Banking Services}
    support-email: ${SUPPORT_EMAIL:support@banking.local}

  security:
    cors:
      allowed-origins:
        - ${CORS_ORIGIN_1:http://localhost:3000}
        - ${CORS_ORIGIN_2:http://localhost:3001}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      exposed-headers: X-Idempotency-Key,X-Request-Id
      max-age: 3600
