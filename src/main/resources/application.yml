spring:
  application:
    name: banking-backend

  # ── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_db}
    username: ${DB_USER:banking}
    password: ${DB_PASSWORD:changeme}
    hikari:
      pool-name: BankingPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema — Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        default_schema: banking

  # ── Flyway migrations ─────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: banking
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Redis — idempotency keys and caching ─────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ── Mail — points at self-hosted Postal SMTP ──────────────────────────────
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    from: ${MAIL_FROM:noreply@banking.local}

  # ── Security — Keycloak as OAuth2 resource server ────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak OIDC discovery endpoint for your realm
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/banking/protocol/openid-connect/certs}

  # ── Spring Modulith — events persistence (outbox pattern) ────────────────
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

  # ── Caching ───────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 86400000   # 24 hours default TTL

  # ── Thymeleaf — email templates ───────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:true}

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  error:
    include-message: never     # Never leak exception messages in production
    include-stacktrace: never
  servlet:
    context-path: /api

# ── Actuator — Prometheus scrape endpoint ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:0.1}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth2-redirect-url: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/banking}/protocol/openid-connect/auth
  show-actuator: false

# ── Application-specific properties ──────────────────────────────────────
banking:
  keycloak:
    realm: ${KEYCLOAK_REALM:banking}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:banking-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}

  idempotency:
    ttl-hours: 24               # How long idempotency keys are cached in Redis

  # ── Fee schedule ─────────────────────────────────────────────────────────
  # Three independently configurable fee contexts.
  # Each slot supports: NONE, PERCENTAGE, FLAT, NIGERIAN_INTERBANK.
  # Restart the app after any change.
  #
  # intrabank-transfer: sender and receiver are both accounts on this system
  # outgoing-transfer:  receiver is external (Paystack/NIBSS destination)
  # withdrawal:         cash withdrawal from an account
  fees:
    intrabank-transfer:
      type: ${FEE_INTRABANK:NONE}
      # Example — flat ₦10:
      # type: FLAT
      # flat-amount: 10.00
      # fee-currency: NGN
    outgoing-transfer:
      type: ${FEE_OUTGOING:NONE}
      # Example — Nigerian interbank (0.1%, min ₦10, max ₦2,000):
      # type: NIGERIAN_INTERBANK
    withdrawal:
      type: ${FEE_WITHDRAWAL:NONE}
      # Example — flat ₦20:
      # type: FLAT
      # flat-amount: 20.00
      # fee-currency: NGN

  # ── Overdraft policy ──────────────────────────────────────────────────────
  # Controls whether accounts can go below zero on withdrawal.
  # Options: NONE (default), FIXED_LIMIT
  overdraft:
    type: ${OVERDRAFT_POLICY_TYPE:NONE}
    # Uncomment for FIXED_LIMIT (allow up to ₦5,000 overdraft per account):
    # limit-amount: 5000.00
    # limit-currency: NGN

  notifications:
    from-name: ${NOTIFICATION_FROM_NAME:Banking Services}
    support-email: ${SUPPORT_EMAIL:support@banking.local}

  security:
    cors:
      allowed-origins:
        - ${CORS_ORIGIN_1:http://localhost:3000}
        - ${CORS_ORIGIN_2:http://localhost:3001}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      exposed-headers: X-Idempotency-Key,X-Request-Id
      max-age: 3600
