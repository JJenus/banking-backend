<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="email/_base :: layout(~{::content})">
<body>
<th:block th:ref="content">
  <div th:fragment="content">
    <h1 style="font-size:20px; margin:0 0 16px;">Welcome aboard, <span th:text="${ownerName}">there</span>.</h1>
    <p style="margin:0 0 16px;">Your account is now open and ready to use.</p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background-color:#f4f5f7; border-radius:6px; margin:0 0 16px;">
      <tr>
        <td style="padding:16px;">
          <p style="margin:0; font-size:13px; color:#6b7280;">Account ID</p>
          <p style="margin:4px 0 0; font-size:16px; font-weight:bold; font-family:monospace;"
             th:text="${accountId}">ACC-XXXXXXXXXX</p>
        </td>
      </tr>
    </table>
    <p style="margin:0 0 16px;">You can now deposit funds, send transfers, and view your statement at any time.</p>
    <p style="margin:0; color:#6b7280; font-size:13px;">Keep this account ID handy — you'll need it for transfers and support requests.</p>
  </div>
</th:block>
</body>
</html>
