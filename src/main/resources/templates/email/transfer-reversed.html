<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="email/_base :: layout(~{::content})">
<body>
<th:block th:ref="content">
  <div th:fragment="content">
    <h1 style="font-size:20px; margin:0 0 16px; color:#c0392b;">Transfer reversed</h1>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background-color:#fdf2f1; border-left:4px solid #c0392b; border-radius:6px; margin:0 0 16px;">
      <tr>
        <td style="padding:16px;">
          <p style="margin:0; font-size:13px; color:#991b1b;">Amount returned to your balance</p>
          <p style="margin:4px 0 0; font-size:24px; font-weight:bold; color:#c0392b;" th:text="${amount}">0.00</p>
        </td>
      </tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
      <tr>
        <td style="padding:4px 0; font-size:13px; color:#6b7280;">Original recipient</td>
        <td style="padding:4px 0; font-size:13px; text-align:right; font-family:monospace;" th:text="${toAccountId}">ACC-XXXXXXXXXX</td>
      </tr>
    </table>
    <p style="margin:0 0 8px; font-size:13px; color:#6b7280;">Reason for reversal:</p>
    <p style="margin:0; padding:12px; background-color:#f9fafb; border-radius:4px; font-size:14px;"
       th:text="${reason}">Reason text</p>
  </div>
</th:block>
</body>
</html>
