<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="email/_base :: layout(~{::content})">
<body>
<th:block th:ref="content">
  <div th:fragment="content">
    <h1 style="font-size:20px; margin:0 0 16px;">We've received your documents</h1>
    <p style="margin:0 0 16px;">
      Thanks for submitting your verification documents. Our compliance team will review them
      and you'll receive an update by email once a decision is made.
    </p>
    <p style="margin:0; color:#6b7280; font-size:13px;">This usually takes 1–2 business days.</p>
  </div>
</th:block>
</body>
</html>
