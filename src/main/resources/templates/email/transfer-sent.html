<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="email/_base :: layout(~{::content})">
<body>
<th:block th:ref="content">
  <div th:fragment="content">
    <h1 style="font-size:20px; margin:0 0 16px;">Transfer sent</h1>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background-color:#f4f5f7; border-radius:6px; margin:0 0 16px;">
      <tr>
        <td style="padding:16px;">
          <p style="margin:0; font-size:13px; color:#6b7280;">Amount sent</p>
          <p style="margin:4px 0 0; font-size:24px; font-weight:bold;" th:text="${amount}">0.00</p>
        </td>
      </tr>
    </table>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
      <tr>
        <td style="padding:4px 0; font-size:13px; color:#6b7280;">To account</td>
        <td style="padding:4px 0; font-size:13px; text-align:right; font-family:monospace;" th:text="${toAccountId}">ACC-XXXXXXXXXX</td>
      </tr>
      <tr>
        <td style="padding:4px 0; font-size:13px; color:#6b7280;">Transfer reference</td>
        <td style="padding:4px 0; font-size:13px; text-align:right; font-family:monospace;" th:text="${transferId}">TRF-XXXXXXXXXXXX</td>
      </tr>
    </table>
    <p style="margin:0; color:#6b7280; font-size:13px;">This transfer has completed successfully and your balance has been updated.</p>
  </div>
</th:block>
</body>
</html>
