<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="email/_base :: layout(~{::content})">
<body>
<th:block th:ref="content">
  <div th:fragment="content">
    <h1 style="font-size:20px; margin:0 0 16px; color:#c0392b;">Transfer failed — ops alert</h1>
    <p style="margin:0 0 16px; font-size:13px; color:#6b7280;">
      Internal notice: a transfer failed during execution. No customer notification was sent
      because the originating/destination account could not be reliably resolved at the point
      of failure.
    </p>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px;">
      <tr>
        <td style="padding:4px 0; font-size:13px; color:#6b7280;">Transfer ID</td>
        <td style="padding:4px 0; font-size:13px; text-align:right; font-family:monospace;" th:text="${transferId}">TRF-XXXXXXXXXXXX</td>
      </tr>
    </table>
    <p style="margin:0 0 8px; font-size:13px; color:#6b7280;">Failure reason:</p>
    <p style="margin:0; padding:12px; background-color:#fdf2f1; border-radius:4px; font-size:14px; color:#c0392b;"
       th:text="${reason}">Reason text</p>
  </div>
</th:block>
</body>
</html>
