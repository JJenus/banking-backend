global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: banking-backend

scrape_configs:
  - job_name: banking-app
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['app:8080']
    scrape_interval: 10s

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
