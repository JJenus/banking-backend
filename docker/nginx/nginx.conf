worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Banking API ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Redirect HTTP → HTTPS in production (uncomment below)
        # return 301 https://$host$request_uri;

        # ── Spring Boot API
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://app:8080/api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── Keycloak auth
        location /auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffer_size   128k;
            proxy_buffers       4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ── Actuator health (internal — remove in production if behind firewall)
        location /actuator/health {
            proxy_pass http://app:8080/api/actuator/health;
        }

        # ── Swagger UI
        location /swagger-ui/ {
            proxy_pass http://app:8080/api/swagger-ui/;
            proxy_set_header Host $host;
        }
    }

    # ── HTTPS (uncomment and configure for production with real certs) ────────
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/    { proxy_pass http://app:8080/api/; }
    #     location /auth/   { proxy_pass http://keycloak:8080/; }
    # }
}
