version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Banking Backend — self-hosted Docker Compose stack
#
# Services:
#   postgres    — PostgreSQL 16 (bank_db + keycloak_db schemas)
#   redis       — Redis 7 (idempotency keys, caching)
#   keycloak    — Keycloak 26 IAM (OAuth2/OIDC, self-hosted, Apache 2.0)
#   postal      — Postal SMTP server (email, self-hosted, MIT license)
#   app         — Spring Boot banking backend
#   prometheus  — metrics scraping
#   grafana     — dashboards (self-hosted, AGPL)
#   nginx       — reverse proxy + SSL termination
#
# Usage:
#   docker compose up -d                         # start all services
#   docker compose up -d postgres redis keycloak # start dependencies only
#   docker compose logs -f app                   # follow app logs
#   docker compose down -v                       # destroy everything including volumes
# ─────────────────────────────────────────────────────────────────────────────

networks:
  banking-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  postal-data:
  prometheus-data:
  grafana-data:
  nginx-certs:

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: bank_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking} -d bank_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: banking-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - banking-net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak 26 ───────────────────────────────────────────────────────────
  # Apache 2.0 license — fully free, self-hosted, no paywall
  # Admin UI: http://localhost:8180/admin  (admin / changeme)
  # Banking realm: http://localhost:8180/realms/banking
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: banking-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-banking}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: 8180
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./docker/keycloak/realm-banking.json:/opt/keycloak/data/import/realm-banking.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8180:8080"
    networks:
      - banking-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/banking || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Postal SMTP Server ────────────────────────────────────────────────────
  # MIT license — fully free, self-hosted email server
  # Web UI: http://localhost:5000  (set up on first run)
  postal:
    image: ghcr.io/postalserver/postal:3
    container_name: banking-postal
    restart: unless-stopped
    environment:
      POSTAL_DB_HOST: postgres
      POSTAL_DB_PORT: 5432
      POSTAL_DB_NAME: postal_db
      POSTAL_DB_USERNAME: ${POSTGRES_USER:-banking}
      POSTAL_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTAL_RAILS_SECRET_KEY: ${POSTAL_SECRET_KEY:-change_this_to_a_long_random_string_in_production}
      POSTAL_WEB_HOSTNAME: ${POSTAL_HOSTNAME:-localhost}
    volumes:
      - postal-data:/opt/postal/config
    ports:
      - "5000:5000"   # Web UI
      - "2525:25"     # SMTP (mapped to 2525 externally to avoid port 25 restrictions)
    networks:
      - banking-net
    depends_on:
      postgres:
        condition: service_healthy

  # ── Spring Boot Banking Backend ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:postgresql://postgres:5432/bank_db
      DB_USER: ${POSTGRES_USER:-banking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      MAIL_HOST: postal
      MAIL_PORT: 25
      MAIL_FROM: ${MAIL_FROM:-noreply@banking.local}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/banking
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/banking/protocol/openid-connect/certs
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - banking-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: banking-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - banking-net
    depends_on:
      - app

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: banking-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - banking-net
    depends_on:
      - prometheus

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: banking-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    networks:
      - banking-net
    depends_on:
      - app
      - keycloak
